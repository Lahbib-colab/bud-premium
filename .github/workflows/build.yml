name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    name: Compiler sur ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]

    steps:
      - uses: actions/checkout@v4

      - name: Environnement
        run: |
          sw_vers
          xcode-select -p
          xcrun --show-sdk-version
          xcrun swiftc --version

      # BUD se compile sans Xcode projet ni Swift Package : un simple
      # appel à swiftc sur Sources/. C'est ce que fait build.sh check.
      # On invoque par « bash » et non « ./ » : un fichier ajouté depuis
      # l'interface web de GitHub arrive en mode 644, et « ./build.sh »
      # échouerait sur « permission denied ». Le dépôt ne dépend donc
      # d'aucun bit d'exécution.
      - name: Compiler BUD
        run: bash build.sh check

      # L'installeur d'un seul fichier est versionné dans dist/.
      # On vérifie qu'il correspond bien aux sources du commit, sinon
      # un utilisateur téléchargerait une version périmée.
      - name: dist/ est-il synchronisé avec Sources/ ?
        run: |
          bash Tools/make-installer.sh "$RUNNER_TEMP/Installer.command"
          if ! diff -q "$RUNNER_TEMP/Installer.command" dist/Installer_BUD_Premium.command; then
            echo "::error::dist/Installer_BUD_Premium.command est périmé. Lancez bash Tools/make-installer.sh et committez le résultat."
            exit 1
          fi
          echo "Installeur à jour."
